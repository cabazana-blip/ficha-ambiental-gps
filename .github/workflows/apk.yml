name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK disponible
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FichaAmbientalGPS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FichaAmbientalGPS
          path: FichaAmbientalGPS.apk
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" FichaAmbientalGPS.apk --title "Ficha Ambiental GPS v1.0.${{ github.run_number }}" --notes "Version Android de prueba" --latest
